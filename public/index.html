<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>PocketMC by l1mehat</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f1720cc;
      --panelSolid:#0f1720;
      --text:#e6edf3;
      --muted:#9fb0c0;
      --accent:#64b5ff;
      --danger:#ff6b6b;
      --good:#7CFF6B;
      --slot:#1b2633;
      --slot2:#223140;
      --slotBorder:#2f4256;
    }
    html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:system-ui,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial; color:var(--text);}
    #ui{
  position:fixed; inset:0; pointer-events:none;
  z-index: 10;
}
#container{
  position: fixed;
  inset: 0;
  z-index: 0;
}
    #topRight{
      position:absolute; top:10px; right:10px;
      pointer-events:none;
      display:flex; flex-direction:column; gap:8px;
      align-items:flex-end;
    }
    #modeBadge{
      background:var(--panelSolid);
      border:1px solid #2a3a4f;
      padding:8px 10px;
      border-radius:10px;
      font-size:13px;
      letter-spacing:.2px;
    }
    #chatBox{
      position:absolute; bottom:84px; left:50%; transform:translateX(-50%);
      width:min(700px, 92vw);
      background:var(--panel);
      border:1px solid #2a3a4f;
      border-radius:12px;
      padding:10px;
      pointer-events:auto;
      display:none;
    }
    #chatLog{
      height:140px;
      overflow:auto;
      font-size:13px;
      color:var(--text);
    }
    #chatInputRow{ display:flex; gap:8px; margin-top:8px; }
    #chatInput{
      flex:1;
      background:#0a111a;
      border:1px solid #2a3a4f;
      border-radius:10px;
      padding:8px 10px;
      color:var(--text);
      outline:none;
    }
    #chatSend{
      background:#0a111a;
      border:1px solid #2a3a4f;
      border-radius:10px;
      padding:8px 12px;
      color:var(--text);
      cursor:pointer;
    }

    #crosshair{
      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      width:18px; height:18px;
      pointer-events:none;
      opacity:.9;
    }
    #crosshair:before, #crosshair:after{
      content:"";
      position:absolute; left:50%; top:50%;
      background:rgba(230,237,243,0.85);
      transform:translate(-50%,-50%);
    }
    #crosshair:before{ width:2px; height:18px; }
    #crosshair:after{ width:18px; height:2px; }

    #miningBarWrap{
      position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
      width:min(420px, 70vw); height:12px;
      background:rgba(15,23,32,.65);
      border:1px solid #2a3a4f;
      border-radius:10px;
      overflow:hidden;
      pointer-events:none;
      display:none;
    }
    #miningBar{
      height:100%; width:0%;
      background:linear-gradient(90deg, #4fd1ff, #4fff7a);
      transition:width 0.02s linear;
    }

    #hotbar{
      position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
      width:min(680px, 92vw);
      display:flex; justify-content:center; gap:8px;
      pointer-events:none;
    }
    .slot{
      width:56px; height:56px;
      background:rgba(15,23,32,.75);
      border:1px solid #2a3a4f;
      border-radius:12px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      position:relative;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .slot .icon{
      width:36px; height:36px;
      border-radius:10px;
      background:var(--slot2);
      border:1px solid var(--slotBorder);
      display:flex; align-items:center; justify-content:center;
      font-size:11px;
      color:#d8e7ff;
      user-select:none;
    }
    .slot .count{
      position:absolute; bottom:6px; right:8px;
      font-size:12px; color:rgba(230,237,243,.85);
      text-shadow:0 1px 0 rgba(0,0,0,.4);
    }
    .slot.selected{
      outline:2px solid var(--accent);
      transform:translateY(-1px);
    }

    #hint{
      position:absolute; top:10px; left:10px;
      background:var(--panel);
      border:1px solid #2a3a4f;
      border-radius:12px;
      padding:10px 12px;
      font-size:13px;
      pointer-events:none;
      max-width:340px;
    }

    #inventoryModal{
      position:absolute; inset:0;
      background:rgba(0,0,0,.35);
      display:none;
      pointer-events:auto;
    }
    #inventoryPanel{
      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      width:min(1040px, 96vw);
      max-height:min(86vh, 800px);
      background:rgba(15,23,32,.95);
      border:1px solid #2a3a4f;
      border-radius:16px;
      padding:14px;
      overflow:auto;
      box-shadow:0 30px 90px rgba(0,0,0,.55);
    }
    #invHeader{
      display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px;
    }
    #invTitle{
      font-size:16px; font-weight:700;
    }
    .btnRow{ display:flex; gap:10px; align-items:center; }
    .btn{
      background:#0a111a;
      border:1px solid #2a3a4f;
      border-radius:12px;
      padding:8px 12px;
      color:var(--text);
      cursor:pointer;
      font-size:13px;
      user-select:none;
    }
    .btn:hover{ border-color:#3d5573; }

    #invGrid{
      display:grid;
      grid-template-columns: repeat(9, 1fr);
      gap:10px;
    }
    .invItem{
      height:64px;
      background:#0a111a;
      border:1px solid #2a3a4f;
      border-radius:14px;
      display:flex; gap:10px; align-items:center;
      padding:8px 10px;
      cursor:pointer;
      user-select:none;
    }
    .invItem:hover{ border-color:#3d5573; }
    .invItem .miniIcon{
      width:40px; height:40px;
      border-radius:12px;
      background:#0f1720;
      border:1px solid #2a3a4f;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; color:#d8e7ff;
    }
    .invItem .meta{
      display:flex; flex-direction:column; gap:3px;
      min-width:0;
    }
    .invItem .name{
      font-size:12.5px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      color:rgba(230,237,243,.95);
    }
    .invItem .kind{
      font-size:12px; color:var(--muted);
    }

    #overlayMsg{
      position:absolute; inset:0; display:none;
      align-items:center; justify-content:center;
      pointer-events:none;
      color:var(--text);
      font-size:16px;
      background:rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="hint">
      Kliknij aby złapać mysz • <b>E</b> inventory • <b>1-9</b> hotbar • <b>Tab</b> chat • <b>F</b> zmiana trybu (creative/survival)
    </div>
    <div id="topRight">
      <div id="modeBadge">Tryb: —</div>
    </div>

    <div id="crosshair"></div>

    <div id="miningBarWrap"><div id="miningBar"></div></div>

    <div id="hotbar"></div>

    <div id="chatBox">
      <div id="chatLog"></div>
      <div id="chatInputRow">
        <input id="chatInput" placeholder="Napisz wiadomość..." maxlength="120" />
        <button id="chatSend">Wyślij</button>
      </div>
    </div>

    <div id="inventoryModal">
      <div id="inventoryPanel">
        <div id="invHeader">
          <div>
            <div id="invTitle">Inventory</div>
            <div style="font-size:13px;color:var(--muted); margin-top:4px">
              Kliknij item aby wziąć do aktualnego slotu hotbara
            </div>
          </div>
          <div class="btnRow">
            <div class="btn" id="invCloseBtn">Zamknij</div>
          </div>
        </div>
        <div id="invGrid"></div>
      </div>
    </div>

    <div id="overlayMsg">Ładowanie…</div>
  </div>

  <div id="container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (() => {
    // ===================== SOCKET =====================
    const socket = io();

    // ===================== DOM =====================
    const container = document.getElementById('container');
    const hotbarEl = document.getElementById('hotbar');
    const modeBadge = document.getElementById('modeBadge');
    const miningBarWrap = document.getElementById('miningBarWrap');
    const miningBar = document.getElementById('miningBar');
    const inventoryModal = document.getElementById('inventoryModal');
    const invGrid = document.getElementById('invGrid');
    const invCloseBtn = document.getElementById('invCloseBtn');
    const overlayMsg = document.getElementById('overlayMsg');

    const chatBox = document.getElementById('chatBox');
    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSend');

    // ===================== INPUT =====================
    const keys = new Set();
    let leftMouseDown = false;
    let rightMouseDown = false;

    let pointerLocked = false;
    const canvas = document.createElement('canvas');
    canvas.style.display = 'block';
    container.appendChild(canvas);

    function setPointerLock() {
      if (canvas.requestPointerLock) canvas.requestPointerLock();
    }
    document.addEventListener('pointerlockchange', () => {
      pointerLocked = (document.pointerLockElement === canvas);
      if (!pointerLocked) {
        // niech interfejs będzie używalny po wyjściu
        if (inventoryModal.style.display === 'none') document.body.style.cursor = 'default';
      } else {
        document.body.style.cursor = 'none';
      }
    });

    document.addEventListener('mousedown', (e) => {
      // 0: left, 2: right
      if (e.button === 0) leftMouseDown = true;
      if (e.button === 2) rightMouseDown = true;

      if (!pointerLocked && inventoryModal.style.display === 'none') setPointerLock();
    });
    document.addEventListener('mouseup', (e) => {
      if (e.button === 0) leftMouseDown = false;
      if (e.button === 2) rightMouseDown = false;
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Tab') {
        e.preventDefault();
        toggleChat();
        return;
      }
      if (e.code === 'KeyE') {
        e.preventDefault();
        toggleInventory();
        return;
      }
      if (e.code === 'Escape') {
        if (inventoryModal.style.display !== 'none') {
          closeInventory();
          return;
        }
        if (chatBox.style.display !== 'none') {
          toggleChat(false);
          return;
        }
      }
      if (e.code === 'KeyF') {
        // zmiana trybu tylko lokalnie + notify do servera
        if (gameState.local) {
          const newMode = (gameState.local.gameMode === 'creative') ? 'survival' : 'creative';
          setGameMode(newMode);
        }
        return;
      }

      if (/^Digit[1-9]$/.test(e.code)) {
        const n = parseInt(e.code.slice(-1), 10) - 1;
        if (n >= 0 && n < 9) {
          gameState.selectedHotbar = n;
          updateHotbarUI();
        }
      }

      keys.add(e.code);
    });

    document.addEventListener('keyup', (e) => {
      keys.delete(e.code);
    });

    function toggleInventory() {
      if (!worldReady) return;
      if (inventoryModal.style.display === 'none') openInventory();
      else closeInventory();
    }
    function openInventory() {
      inventoryModal.style.display = 'block';
      renderInventoryGrid();
      // zwalniamy pointer lock, żeby klikać
      if (pointerLocked) document.exitPointerLock();
    }
    function closeInventory() {
      inventoryModal.style.display = 'none';
      // jak chcemy, wracamy do gry
      setTimeout(() => { if (!pointerLocked) setPointerLock(); }, 0);
    }

    function toggleChat(force) {
      const show = (force !== undefined) ? force : (chatBox.style.display === 'none');
      chatBox.style.display = show ? 'block' : 'none';
      if (show) {
        chatInput.focus();
        if (pointerLocked) document.exitPointerLock();
      } else {
        if (!inventoryModal || inventoryModal.style.display === 'none') setPointerLock();
      }
    }

    chatSend.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChat();
    });
    function sendChat(){
      const msg = (chatInput.value || '').trim();
      if (!msg) return;
      socket.emit('chatMessage', msg);
      chatInput.value = '';
      toggleChat(false);
    }

    // ===================== WORLD DEFINITIONS (SERVER-MATCH) =====================
    let worldReady = false;

    // server config
    const cfg = {
      CHUNK_SIZE: 16,
      WORLD_SIZE: 1024,
      WORLD_HEIGHT: 64,
      WATER_LEVEL: 12,
      MAX_BUILD_DISTANCE: 8.0
    };
let TREE_PROB = 0.03;
    // deterministic base world (must match server.js)
    function simpleNoise(x, z, seed, worldSize) {
      const nx = x - worldSize / 2;
      const nz = z - worldSize / 2;
      const s = seed * 0.0001;

      const h =
        10 +
        Math.sin((nx + s) * 0.04) * 8 +
        Math.cos((nz - s) * 0.04) * 8 +
        Math.sin((nx + nz + s) * 0.02) * 4;

      return Math.floor(h);
    }

    function pseudoRandom(x, z, seed) {
      const v = Math.sin(x * 12.9898 + z * 78.233 + seed * 37.719) * 43758.5453;
      return v - Math.floor(v);
    }

    function clampInt(n, a, b) {
      return Math.max(a, Math.min(b, n | 0));
    }

    function getColumnHeight(x, z, seed) {
      const h = simpleNoise(x, z, seed, cfg.WORLD_SIZE);
      return clampInt(h, 1, cfg.WORLD_HEIGHT - 1);
    }

function signal3D(x, y, z, seed, f, yScale) {
  const a = Math.sin((x + seed * 0.13) * f) * Math.cos((z - seed * 0.07) * f);
  const b = Math.sin((y + seed * 0.09) * (f * yScale)) * 0.85;
  return Math.abs(a + b) / 1.85;
}

function shouldCarveCave(x, y, z, seed) {
  if (y < 6 || y > cfg.WORLD_HEIGHT - 7) return false;

  const d = y / cfg.WORLD_HEIGHT;
  const depthBias = 1 - Math.min(1, Math.abs(d - 0.32) / 0.32);
  const threshold = 0.60 - depthBias * 0.10;

  const c = signal3D(x, y, z, seed + 777, 0.09, 0.72);
  return c > threshold;
}

function clusteredOreInStone(x, y, z, seed) {
  if (y >= 6 && y <= 26) {
    const n = signal3D(x, y, z, seed + 202, 0.17, 0.78);
    const gate = pseudoRandom(x + y * 0.07, z - y * 0.03, seed + 999);
    if (n > 0.60 && gate < 0.18) return 'gold_ore';
  }

  if (y >= 5 && y <= 45) {
    const n = signal3D(x, y, z, seed + 101, 0.15, 0.78);
    const gate = pseudoRandom(x + y * 0.05, z - y * 0.02, seed + 333);
    if (n > 0.62 && gate < 0.26) return 'coal_ore';
  }

  return 'stone';
}
    
    function getBaseBlockType(x, y, z, seed) {
  if (x < 0 || x >= cfg.WORLD_SIZE || z < 0 || z >= cfg.WORLD_SIZE) return null;
  if (y < 0 || y >= cfg.WORLD_HEIGHT) return null;

  const h = getColumnHeight(x, z, seed);

  const maxY = Math.max(h, cfg.WATER_LEVEL);
  let type = null;

  if (y <= maxY) {
    if (y > h) type = 'water';
    else if (y === h) type = h <= cfg.WATER_LEVEL + 1 ? 'sand' : 'grass';
    else if (y > h - 3) type = h <= cfg.WATER_LEVEL + 1 ? 'sand' : 'dirt';
    else {
      if (shouldCarveCave(x, y, z, seed)) type = null;
      else type = clusteredOreInStone(x, y, z, seed);
    }
  }

  const baseTreeRadius = 2;

  for (let dx0 = -baseTreeRadius; dx0 <= baseTreeRadius; dx0++) {
    for (let dz0 = -baseTreeRadius; dz0 <= baseTreeRadius; dz0++) {
      const tx = x + dx0;
      const tz = z + dz0;
      if (tx < 0 || tx >= cfg.WORLD_SIZE || tz < 0 || tz >= cfg.WORLD_SIZE) continue;

      const th = getColumnHeight(tx, tz, seed);
      if (!(th > cfg.WATER_LEVEL + 1)) continue;

      const hasTree = pseudoRandom(tx, tz, 999 + seed * 13) < TREE_PROB;
      if (!hasTree) continue;

      const trunkHeight = 4;
      const trunkTopY = th + trunkHeight;
      const treeOriginY = th + 1;

      if (x === tx && z === tz && y >= treeOriginY && y < treeOriginY + trunkHeight) {
        return 'wood';
      }

      const leafY = trunkTopY + 1;
      const dx = x - tx;
      const dz = z - tz;
      const dy = y - leafY;

      if (dx < -2 || dx > 2 || dz < -2 || dz > 2) continue;
      if (dy < -1 || dy > 1) continue;

      const dist = Math.abs(dx) + Math.abs(dz) + Math.abs(dy);
      if (dist <= 3 && !(dx === 0 && dz === 0 && dy <= 0)) {
        return 'leaves';
      }
    }
  }

  return type;
}

    // ===================== RENDERING / THREE =====================
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x88a9d6, 18, 90);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.style.position = 'relative';

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 250);
    camera.position.set(0, 10, 10);

    // lights
    const hemi = new THREE.HemisphereLight(0xbad7ff, 0x1b2230, 0.85);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xffffff, 0.65);
    dir.position.set(50, 80, 30);
    scene.add(dir);

    // sky-ish background
    scene.background = new THREE.Color(0x9ec6ff);

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // ===================== BLOCKS + COLORS =====================
    const BLOCK_COLORS = {
      grass:   0x3ba64c,
      dirt:    0x7a4a2a,
      stone:   0x8e97a6,
      sand:    0xd7c07a,
      water:   0x2a86ff,
      wood:    0x8b5a2b,
      leaves:  0x2fa84f,
      coal_ore:0x3b4450,
      gold_ore:0xffc83d
    };
// ===================== TEXTURES (procedural atlas) =====================
const TILE_SIZE = 16;
const ATLAS_SIZE = 256; // 16x16 tiles
const tilesPerRow = ATLAS_SIZE / TILE_SIZE;

// deterministyczny mały RNG (do tekstur)
function texRand(seed){
  // 0..1
  const v = Math.sin(seed * 999.123 + seed * seed * 0.0001) * 43758.5453;
  return v - Math.floor(v);
}

function makeTile(drawFn, opts = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = TILE_SIZE;
  canvas.height = TILE_SIZE;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const img = ctx.createImageData(TILE_SIZE, TILE_SIZE);
  const d = img.data;

  function set(px, py, r, g, b, a = 255) {
    if (px < 0 || px >= TILE_SIZE || py < 0 || py >= TILE_SIZE) return;
    const i = (py * TILE_SIZE + px) * 4;
    d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = a;
  }

  drawFn({ set, rand: texRand, opts });

  ctx.putImageData(img, 0, 0);
  return canvas;
}

function packTilesToAtlas(tileMap) {
  const atlas = document.createElement('canvas');
  atlas.width = ATLAS_SIZE;
  atlas.height = ATLAS_SIZE;
  const aCtx = atlas.getContext('2d');

  const order = Object.keys(tileMap);
  for (const k of order) {
    const { tileIndex, canvas } = tileMap[k];
    const col = tileIndex % tilesPerRow;
    const row = Math.floor(tileIndex / tilesPerRow);
    aCtx.imageSmoothingEnabled = false;
    aCtx.drawImage(canvas, col * TILE_SIZE, row * TILE_SIZE);
  }

  const tex = new THREE.CanvasTexture(atlas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

// tile indices
const TEX = {
  grass_top: 0,
  grass_side: 1,
  dirt: 2,
  stone: 3,
  sand: 4,
  water: 5,
  wood_top: 6,
  wood_side: 7,
  leaves: 8,
  coal_ore: 9,
  gold_ore: 10
};

function drawGrassTop({ set, rand }) {
  // base
  for (let y = 0; y < TILE_SIZE; y++) {
    for (let x = 0; x < TILE_SIZE; x++) {
      const edge = (x < 2 || x > 13 || y < 2 || y > 13) ? 1 : 0;
      const base = edge ? [72, 170, 72] : [76, 196, 76];
      let [r,g,b] = base;

      const s = rand(x + y * 17 + 1000);
      if (s > 0.70) { r -= 20; g -= 15; }
      if (s < 0.12) { r += 10; g += 18; }

      set(x,y,r,g,b,255);
    }
  }
  // “pixel shading” na rogu
  for (let x = 0; x < 16; x++) {
    set(x, 0, 60, 140, 60);
    set(x, 15, 40, 100, 40);
  }
}

function drawGrassSide({ set, rand }) {
  for (let y = 0; y < TILE_SIZE; y++) {
    for (let x = 0; x < TILE_SIZE; x++) {
      let [r,g,b] = [30, 130, 50];
      const s = rand(x + y * 19 + 2000);
      if (s > 0.72) { r = 24; g = 102; b = 44; }
      if (s < 0.10) { r += 25; g += 20; b += 8; }
      // poziome łaty
      if (y % 4 === 0 && rand(x + y * 13 + 3) > 0.6) { r -= 6; g -= 10; }
      set(x,y,r,g,b,255);
    }
  }
  // lekkie przyciemnienia na krawędziach
  for (let i=0;i<16;i++){
    set(0,i, 15,90,30); set(15,i, 15,90,30);
  }
}

function drawDirt({ set, rand }) {
  for (let y = 0; y < TILE_SIZE; y++) {
    for (let x = 0; x < TILE_SIZE; x++) {
      let [r,g,b] = [114, 79, 54];
      const s = rand(x + y * 23 + 3000);
      if (s > 0.70) { r -= 18; g -= 10; b -= 6; }
      if (s < 0.12) { r += 10; g += 8; b += 4; }
      // jaśniejsze punkty
      if (rand(x + 77 + y * 5 + 33) > 0.86) { r = 140; g = 95; b = 65; }
      set(x,y,r,g,b,255);
    }
  }
}

function drawStone({ set, rand }) {
  for (let y = 0; y < TILE_SIZE; y++) {
    for (let x = 0; x < TILE_SIZE; x++) {
      let [r,g,b] = [135, 145, 160];
      const s = rand(x + y * 29 + 4000);
      if (s > 0.80) { r -= 35; g -= 35; b -= 30; }
      if (s < 0.10) { r += 20; g += 15; b += 10; }
      // drobne “smugi”
      if (x % 5 === 0 && rand(x + y*7 + 11) > 0.65) { r -= 20; }
      set(x,y,r,g,b,255);
    }
  }
}

function drawSand({ set, rand }) {

      const s = rand(x + y * 31 + 5000);

function drawWater({ set, rand }) {
  // alpha semi-transparent
  for (let y = 0; y < TILE_SIZE; y++) {
    for (let x = 0; x < TILE_SIZE; x++) {
      const s = rand(x + y * 41 + 6000);
      let [r,g,b] = [40, 140, 255];
      if (s > 0.7) { r -= 10; g -= 20; b -= 25; }
      if (s < 0.12) { r += 10; g += 10; b += 5; }
      // “fala”/gradient
      const wave = (Math.sin((x + y) * 0.7) + 1) * 0.5;
      r = Math.round(r - 20 * wave);
      g = Math.round(g - 10 * wave);
      const a = 150 + Math.round(40 * wave);
      set(x,y,r,g,b, a);
    }
  }
}

// tile UV
function getTileUV(tileIndex){
  const col = tileIndex % tilesPerRow;
  const row = Math.floor(tileIndex / tilesPerRow);

  const u0 = (col * TILE_SIZE) / ATLAS_SIZE;
  const u1 = ((col + 1) * TILE_SIZE) / ATLAS_SIZE;

  // flip V for three.js
  const vTop = 1 - (row * TILE_SIZE) / ATLAS_SIZE;
  const vBottom = 1 - ((row + 1) * TILE_SIZE) / ATLAS_SIZE;

  return { u0, u1, vTop, vBottom };
}

function getTileIndexForBlockFace(blockType, faceDir){
  // faceDir: 'px','nx','py','ny','pz','nz' (u Ciebie dokładnie takie klucze)
  switch(blockType){
    case 'grass':
      if (faceDir === 'py') return TEX.grass_top;
      if (faceDir === 'ny') return TEX.dirt;
      return TEX.grass_side;

    case 'dirt': return TEX.dirt;
    case 'stone': return TEX.stone;
    case 'sand': return TEX.sand;
    case 'water': return TEX.water;

    case 'wood':
      if (faceDir === 'py' || faceDir === 'ny') return TEX.wood_top;
      return TEX.wood_side;

    case 'leaves': return TEX.leaves;
    case 'coal_ore': return TEX.coal_ore;
    case 'gold_ore': return TEX.gold_ore;
    default:
      return TEX.stone;
  }
}


    function blockColor(type){
      return (type && BLOCK_COLORS[type] !== undefined) ? BLOCK_COLORS[type] : 0xffffff;
    }

    // ===================== INVENTORY / TOOLS / DROPS =====================
    // Placeable blocks
    const PLACEABLE_BLOCKS = new Set([
      'grass','dirt','stone','sand','wood','leaves','coal_ore','gold_ore','water'
    ]);

    // Tools definition: tag, eff, non
    // eff/non are "tool categories" effective/ineffective against block "tags"
    const TOOL_DEFS = {
      hand: { tag:'hand', eff:[], non:[] },

      // pickaxe
      wooden_pickaxe: { tag:'pickaxe', eff:['pickaxe'], non:['axe','shovel'] },
      stone_pickaxe:  { tag:'pickaxe', eff:['pickaxe'], non:['axe','shovel'] },
      iron_pickaxe:   { tag:'pickaxe', eff:['pickaxe'], non:['axe','shovel'] },
      diamond_pickaxe:{ tag:'pickaxe', eff:['pickaxe'], non:['axe','shovel'] },

      // axe
      wooden_axe: { tag:'axe', eff:['axe'], non:['pickaxe','shovel'] },
      stone_axe:  { tag:'axe', eff:['axe'], non:['pickaxe','shovel'] },
      iron_axe:   { tag:'axe', eff:['axe'], non:['pickaxe','shovel'] },
      diamond_axe:{ tag:'axe', eff:['axe'], non:['pickaxe','shovel'] },

      // shovel
      wooden_shovel: { tag:'shovel', eff:['shovel'], non:['pickaxe','axe'] },
      stone_shovel:  { tag:'shovel', eff:['shovel'], non:['pickaxe','axe'] },
      iron_shovel:   { tag:'shovel', eff:['shovel'], non:['pickaxe','axe'] },
      diamond_shovel:{ tag:'shovel', eff:['shovel'], non:['pickaxe','axe'] }
    };

    // Tool "tier speed"
    const TOOL_SPEED = {
      hand: 0.45,

      wooden: 1.0,
      stone:  1.35,
      iron:   1.75,
      diamond:2.2
    };

    function getToolTierKey(toolItemKey){
      // extract prefix: wooden/stone/iron/diamond
      if (!toolItemKey || toolItemKey === 'hand') return null;
      if (toolItemKey.startsWith('wooden_')) return 'wooden';
      if (toolItemKey.startsWith('stone_')) return 'stone';
      if (toolItemKey.startsWith('iron_')) return 'iron';
      if (toolItemKey.startsWith('diamond_')) return 'diamond';
      return null;
    }

    // Block hardness (base seconds with hand at speed 1.0-ish)
    const BLOCK_HARDNESS = {
      grass: 0.55,
      dirt:  0.45,
      sand:  0.50,
      stone: 1.25,

      wood:  0.85,
      leaves:0.35,

      coal_ore:  2.2,
      gold_ore:  2.8,

      water: 0.20
    };

    function getBlockEffectiveToolTag(blockType){
      if (!blockType) return null;
      if (blockType === 'wood' || blockType === 'leaves') return 'axe';
      if (blockType === 'sand' || blockType === 'dirt' || blockType === 'grass') return 'shovel';
      if (blockType === 'stone' || blockType === 'coal_ore' || blockType === 'gold_ore') return 'pickaxe';
      return null;
    }

    function getBreakDurationSeconds(blockType, toolItemKey){
      const hardness = BLOCK_HARDNESS[blockType] ?? 1.0;

      if (!toolItemKey || toolItemKey === 'hand') {
        // slow
        return hardness / 0.45; // ~hand speed
      }

      const def = TOOL_DEFS[toolItemKey] || TOOL_DEFS.hand;
      const effectiveTag = getBlockEffectiveToolTag(blockType);

      const tier = getToolTierKey(toolItemKey);
      const baseSpeed = TOOL_SPEED[tier] ?? 1.0;

      let multiplier = 1.0;
      if (effectiveTag && def.eff.includes(effectiveTag)) multiplier = 1.0;
      else if (def.non && def.non.includes(effectiveTag)) multiplier = 2.5;
      else multiplier = 1.6; // neutral

      const speed = baseSpeed / multiplier;
      const duration = hardness / Math.max(0.12, speed);
      return Math.max(0.05, duration);
    }

    // deterministic RNG for drops
    function rand01From(a,b,c,seed){
      const v = Math.sin(a*12.9898 + b*78.233 + c*37.719 + seed*0.0001) * 43758.5453;
      return v - Math.floor(v);
    }

    function getDropsForBlock(blockType, toolItemKey, x,y,z){
      // returns array: [{key,count}, ...]
      if (!blockType) return [];
      if (blockType === 'water') return []; // no drops

      const effectiveTag = getBlockEffectiveToolTag(blockType);
      const def = TOOL_DEFS[toolItemKey] || TOOL_DEFS.hand;
      const isPickAxeEff = effectiveTag && def.eff.includes(effectiveTag);

      // Ore drop logic (depends on tool)
      if (blockType === 'coal_ore') {
        if (effectiveTag !== 'pickaxe' || !isPickAxeEff) {
          // wrong tool => nothing (MC-ish "no ore" feeling)
          return [];
        }
        const r = rand01From(x,y,z,cfgSeedHash(), worldSeed);
        const count = (r < 0.12) ? 2 : 1;
        return [{ key:'coal', count }];
      }
      if (blockType === 'gold_ore') {
        if (effectiveTag !== 'pickaxe' || !isPickAxeEff) return [];
        const r = rand01From(x,y,z,cfgSeedHash()+17, worldSeed);
        const count = (r < 0.08) ? 2 : 1;
        return [{ key:'gold_ingot', count }];
      }

      // Leaves drop: axe helps
      if (blockType === 'leaves') {
        const r = rand01From(x,y,z,99, worldSeed);
        const base = isPickAxeEff ? 1 : 1;
        // if axe is effective then def.eff includes 'axe' => multiplier better
        const shouldDrop = rand01From(x,y,z,133, worldSeed) < ( (effectiveTag && def.eff.includes(effectiveTag)) ? 0.95 : 0.35);
        if (!shouldDrop) return [];
        return [{ key:'leaves', count: base + (r < 0.18 ? 1 : 0) }];
      }

      // Wood drop: axe helps, but still can with hand
      if (blockType === 'wood') {
        const shouldDrop = rand01From(x,y,z,7, worldSeed) < ( (effectiveTag && def.eff.includes(effectiveTag)) ? 0.95 : 0.75);
        if (!shouldDrop) return [];
        return [{ key:'wood', count: (rand01From(x,y,z,8, worldSeed) < 0.12 ? 2 : 1) }];
      }

      // Other blocks: generally drop themselves
      const dropKey = blockType; // same key as block item
      const r = rand01From(x,y,z,321, worldSeed);
      let chance = 0.90;

      if (effectiveTag && def.eff.includes(effectiveTag)) chance = 0.95;
      else {
        // if wrong tool category => harder to get
        // (dirt/sand with pickaxe => neutral-ish)
        chance = 0.65;
      }
      if (r > chance) return [];
      return [{ key: dropKey, count: (r < 0.05 ? 2 : 1) }];
    }

      for (const d of drops){
        const count = d.count|0;
        if (count <= 0) continue;
        let remaining = count;

        // 1) stack in hotbar
        for (let i=0;i<HOTBAR_SIZE && remaining>0;i++){
          const st = gameState.hotbar[i];
          if (st.key === d.key && st.count < 64){
            const can = Math.min(64 - st.count, remaining);
            st.count += can;
            remaining -= can;
          }
        }

        // 2) stack in main
        for (let i=0;i<INV_SIZE && remaining>0;i++){
          const st = gameState.inv[i];
          if (st.key === d.key && st.count < 64){
            const can = Math.min(64 - st.count, remaining);
            st.count += can;
            remaining -= can;
          }
        }

        // 3) empty slots
        for (let i=0;i<HOTBAR_SIZE && remaining>0;i++){
          const st = gameState.hotbar[i];
          if (!st.key){
            const can = Math.min(64, remaining);
            gameState.hotbar[i] = { key:d.key, count:can };
            remaining -= can;
          }
        }
        for (let i=0;i<INV_SIZE && remaining>0;i++){
          const st = gameState.inv[i];
          if (!st.key){
            const can = Math.min(64, remaining);

    // editsByChunk: key => { "x,y,z": typeOrNull }
    function getEffectiveBlockType(x,y,z){
      if (x < 0 || x >= cfg.WORLD_SIZE || z < 0 || z >= cfg.WORLD_SIZE) return null;
      if (y < 0 || y >= cfg.WORLD_HEIGHT) return null;

      const cx = Math.floor(x / cfg.CHUNK_SIZE);
      const cz = Math.floor(z / cfg.CHUNK_SIZE);
      const cKey = chunkKey(cx, cz);
      const chunkEdits = gameState.editsByChunk[cKey];

      const coordKey = `${x},${y},${z}`;
      if (chunkEdits && Object.prototype.hasOwnProperty.call(chunkEdits, coordKey)) {
        return chunkEdits[coordKey]; // string or null
      }
      return getBaseBlockType(x,y,z, worldSeed);
    }

    function setEffectiveBlockTypeLocal(x,y,z, newTypeOrNull){
      if (x < 0 || x >= cfg.WORLD_SIZE || z < 0 || z >= cfg.WORLD_SIZE) return false;
      if (y < 0 || y >= cfg.WORLD_HEIGHT) return false;

      const cx = Math.floor(x / cfg.CHUNK_SIZE);
      const cz = Math.floor(z / cfg.CHUNK_SIZE);
      const cKey = chunkKey(cx, cz);

      gameState.editsByChunk[cKey] ||= {};
      const coordKey = `${x},${y},${z}`;
      const baseType = getBaseBlockType(x,y,z, worldSeed);

      // mimic server: if override equals base, remove edit
      if (baseType === newTypeOrNull) {
        if (gameState.editsByChunk[cKey] && Object.prototype.hasOwnProperty.call(gameState.editsByChunk[cKey], coordKey)) {
          delete gameState.editsByChunk[cKey][coordKey];
          if (Object.keys(gameState.editsByChunk[cKey]).length === 0) delete gameState.editsByChunk[cKey];
          markChunkDirty(cx,cz);
          return true;
        }
        return false;
      }

      gameState.editsByChunk[cKey][coordKey] = newTypeOrNull;
      markChunkDirty(cx,cz);
      return true;
    }

    // chunk mesh build
    function makeFaceVertices(x0,y0,z0, dir){
      const x1 = x0+1, y1=y0+1, z1=z0+1;
      // dir mapping
      switch(dir){
        case 'px': return [ x1,y0,z0,  x1,y1,z0,  x1,y1,z1,  x1,y0,z1 ];
        case 'nx': return [ x0,y0,z1,  x0,y1,z1,  x0,y1,z0,  x0,y0,z0 ];
        case 'py': return [ x0,y1,z0,  x0,y1,z1,  x1,y1,z1,  x1,y1,z0 ];
        case 'ny': return [ x0,y0,z0,  x1,y0,z0,  x1,y0,z1,  x0,y0,z1 ];
        case 'pz': return [ x0,y0,z1,  x1,y0,z1,  x1,y1,z1,  x0,y1,z1 ];
        case 'nz': return [ x1,y0,z0,  x0,y0,z0,  x0,y1,z0,  x1,y1,z0 ];
        default: return null;
      }
    }

    function shadeColor(col, factor){
      // factor <1 darkens
      const r = ((col>>16)&255), g=((col>>8)&255), b=(col&255);
      const rr = Math.max(0, Math.min(255, Math.round(r*factor)));
      const gg = Math.max(0, Math.min(255, Math.round(g*factor)));
      const bb = Math.max(0, Math.min(255, Math.round(b*factor)));
      return (rr<<16)|(gg<<8)|bb;
    }

    const DIRS = [
      ['px','nx', 1.0, 0,0,1],
      ['nx','px', 0.8, 0,0,-1],
      ['py','ny', 1.0, 0,1,0],
      ['ny','py', 0.7, 0,-1,0],
      ['pz','nz', 0.9, 0,0,1],
      ['nz','pz', 0.85,0,0,-1]
    ];

    function addQuad(positions, uvs, indices, dirKey, x0,y0,z0, blockType){
  const verts = makeFaceVertices(x0,y0,z0, dirKey);
  if (!verts) return;

  const tileIndex = getTileIndexForBlockFace(blockType, dirKey);
  const { u0, u1, vTop, vBottom } = getTileUV(tileIndex);

  // Vertex order z makeFaceVertices:
  // v0 = [0..2], v1 = [3..5], v2 = [6..8], v3 = [9..11]
  // mapujemy: v0(bottom-left), v1(top-left), v2(top-right), v3(bottom-right)
  const baseIndex = positions.length / 3;

  positions.push(
    verts[0],verts[1],verts[2],
    verts[3],verts[4],verts[5],
    verts[6],verts[7],verts[8],
    verts[9],verts[10],verts[11]
  );

  uvs.push(
    u0, vBottom,   // v0
    u0, vTop,      // v1
    u1, vTop,      // v2
    u1, vBottom    // v3
  );

  indices.push(baseIndex, baseIndex+1, baseIndex+2, baseIndex, baseIndex+2, baseIndex+3);
}

    const CHUNK_RADIUS = 3;    // matches earlier requirement
    const UNLOAD_MARGIN = 1;

    const rebuildQueue = new Set();
    let rebuildScheduled = false;

    function scheduleRebuild(cx,cz){
      rebuildQueue.add(chunkKey(cx,cz));
      if (!rebuildScheduled){
        rebuildScheduled = true;
        setTimeout(() => {
          rebuildScheduled = false;
          const keys = Array.from(rebuildQueue);
          rebuildQueue.clear();
          for (const k of keys){
            const [scx, scz] = k.split(','); const cx = parseInt(scx,10); const cz = parseInt(scz,10);
            updateChunkMesh(cx,cz);
          }
        }, 0);
      }
    }

    function markChunkDirty(cx,cz){
      const cKey = chunkKey(cx,cz);
      scheduleRebuild(cx,cz);
    }

    function getChunkMaterial(){
  return new THREE.MeshLambertMaterial({
    map: atlasTexture,
    transparent: true,
    alphaTest: 0.01
  });
}

    function updateChunkMesh(cx,cz){
      const cKey = chunkKey(cx,cz);
      const existing = gameState.chunkMeshes.get(cKey);
      if (!existing){
        // ensure group exists
        const group = new THREE.Group();
        group.name = cKey;
        worldGroup.add(group);
        gameState.chunkMeshes.set(cKey, { group, mesh:null, cx,cz });
      }
      const rec = gameState.chunkMeshes.get(cKey);
      if (!rec) return;

      // dispose old mesh
      if (rec.mesh){
        rec.group.remove(rec.mesh);
        rec.mesh.geometry.dispose();
        // material disposed? using lambert; dispose geometry enough
        rec.mesh = null;
      }

      const xStart = cx * cfg.CHUNK_SIZE;
      const zStart = cz * cfg.CHUNK_SIZE;
      const xEnd = xStart + cfg.CHUNK_SIZE;
      const zEnd = zStart + cfg.CHUNK_SIZE;

      // caches
      const baseCache = new Map();
      const effCache = new Map();

      function baseTypeCached(x,y,z){
        const k = `${x},${y},${z}`;
        const v = baseCache.get(k);
        if (v !== undefined) return v;
        const bt = getBaseBlockType(x,y,z, worldSeed);
        baseCache.set(k, bt);
        return bt;
      }

      function effTypeCached(x,y,z){
        const k = `${x},${y},${z}`;
        const v = effCache.get(k);
        if (v !== undefined) return v;

        if (x < 0 || x >= cfg.WORLD_SIZE || z < 0 || z >= cfg.WORLD_SIZE || y < 0 || y >= cfg.WORLD_HEIGHT){
          effCache.set(k, null);
          return null;
        }
        const ecx = Math.floor(x / cfg.CHUNK_SIZE);
        const ecz = Math.floor(z / cfg.CHUNK_SIZE);
        const cKey2 = chunkKey(ecx, ecz);
        const chunkEdits = gameState.editsByChunk[cKey2];
        const coordKey2 = `${x},${y},${z}`;
        if (chunkEdits && Object.prototype.hasOwnProperty.call(chunkEdits, coordKey2)){
          const val = chunkEdits[coordKey2];
          effCache.set(k, val);
          return val;
        }
        const bt = baseTypeCached(x,y,z);
        effCache.set(k, bt);
        return bt;
      }

      const positions = [];
const uvs = [];
const indices = [];

      for (let x=xStart; x<xEnd; x++){
        for (let z=zStart; z<zEnd; z++){
          if (x<0 || x>=cfg.WORLD_SIZE || z<0 || z>=cfg.WORLD_SIZE) continue;

          for (let y=0; y<cfg.WORLD_HEIGHT; y++){
            const type = effTypeCached(x,y,z);
            if (!type) continue;

            const baseCol = blockColor(type);

            // neighbor checks: if neighbor is null => draw face
            // +X
            if (!effTypeCached(x+1,y,z)) addQuad(positions, uvs, indices, 'px', x,y,z, type);
            // -X
            if (!effTypeCached(x-1,y,z)) addQuad(positions, uvs, indices, 'px', x,y,z, type);
            // +Y
            if (!effTypeCached(x,y+1,z)) addQuad(positions, uvs, indices, 'px', x,y,z, type);
            // -Y
            if (!effTypeCached(x,y-1,z)) addQuad(positions, uvs, indices, 'px', x,y,z, type);
            // +Z
            if (!effTypeCached(x,y,z+1)) addQuad(positions, uvs, indices, 'px', x,y,z, type);
            // -Z
            if (!effTypeCached(x,y,z-1)) addQuad(positions, uvs, indices, 'px', x,y,z, type);
          }
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();

      const mesh = new THREE.Mesh(geom, getChunkMaterial());
      mesh.frustumCulled = false; // chunks: avoid flicker
      rec.group.add(mesh);
      rec.mesh = mesh;
    }

    function requestChunkIfNeeded(cx,cz){
  const k = chunkKey(cx,cz);
  if (gameState.loadedChunkKeys.has(k)) return;
  if (cx < 0 || cz < 0 || cx >= maxChunk || cz >= maxChunk) return;

  gameState.loadedChunkKeys.add(k);

  // Build od razu (base world z generatora),
  // a gdy przyjdzie chunkData z serwera, to i tak przebudujemy mesh.
  updateChunkMesh(cx,cz);

  socket.emit('requestChunk', { cx, cz });
}

    function unloadFarChunks(px, pz){
      const pcx = Math.floor(px / cfg.CHUNK_SIZE);
      const pcz = Math.floor(pz / cfg.CHUNK_SIZE);

      for (const k of Array.from(gameState.loadedChunkKeys)){
        const [scx, scz] = k.split(',');
        const cx = parseInt(scx,10), cz = parseInt(scz,10);
        const dx = Math.abs(cx - pcx);
        const dz = Math.abs(cz - pcz);

        if (dx > CHUNK_RADIUS + UNLOAD_MARGIN || dz > CHUNK_RADIUS + UNLOAD_MARGIN){
          // remove
          gameState.loadedChunkKeys.delete(k);
          const rec = gameState.chunkMeshes.get(k);
          if (rec){
            worldGroup.remove(rec.group);
            if (rec.mesh) rec.mesh.geometry.dispose();
            rec.group.clear();
            gameState.chunkMeshes.delete(k);
          }
        }
      }
    }

    function updateChunksAroundPlayer(px,pz){
      const pcx = Math.floor(px / cfg.CHUNK_SIZE);
      const pcz = Math.floor(pz / cfg.CHUNK_SIZE);

      for (let dz=-CHUNK_RADIUS; dz<=CHUNK_RADIUS; dz++){
        for (let dx=-CHUNK_RADIUS; dx<=CHUNK_RADIUS; dx++){
          const cx = pcx + dx;
          const cz = pcz + dz;
          requestChunkIfNeeded(cx,cz);
        }
      }
      unloadFarChunks(px,pz);
    }

    // ===================== PLAYER / MOVEMENT / COLLISION =====================
    const PLAYER = {
      width: 0.42,
      height: 1.72,
      eyeHeight: 1.62,
      speedCreative: 7.0,
      speedSurvival: 4.2,
      jumpVelocity: 5.2,
      gravity: 14.0,
      terminalVelocity: 28.0
    };

    // remote player visuals
    function createRemotePlayerMesh(){
      const group = new THREE.Group();
      const mat = new THREE.MeshLambertMaterial({ color: 0x4aa3ff });

      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.16,0.55, 4, 12), mat);
      body.position.y = 0.75;
      group.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), mat);
      head.position.y = 1.02;
      group.add(head);

      // simple nameplate could be added later
      return group;
    }

    // get camera/player direction from yaw/pitch
    let yaw = 0;
    let pitch = 0;

    function setCameraFromPlayer(p){
      // p has x,y,z,yaw,pitch
      yaw = p.yaw;
      pitch = p.pitch;

      // clamp pitch
      pitch = Math.max(-1.45, Math.min(1.45, pitch));
      p.pitch = pitch;

      camera.position.set(p.x, p.y + PLAYER.eyeHeight, p.z);
      const dir = new THREE.Vector3(
        Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw) * Math.cos(pitch)
      );
      const target = new THREE.Vector3().copy(camera.position).add(dir);
      camera.lookAt(target);
    }

    function isSolidBlock(blockType){
      if (!blockType) return false;
      // water not solid; leaves treated as solid-ish
      return blockType !== 'water';
    }

    function worldAABBIntersectsSolid(x0,y0,z0, x1,y1,z1){
      // check blocks in range
      const minX = Math.floor(Math.min(x0,x1));
      const maxX = Math.floor(Math.max(x0,x1));
      const minY = Math.floor(Math.min(y0,y1));
      const maxY = Math.floor(Math.max(y0,y1));
      const minZ = Math.floor(Math.min(z0,z1));
      const maxZ = Math.floor(Math.max(z0,z1));

      for (let x=minX; x<=maxX; x++){
        for (let y=minY; y<=maxY; y++){
          for (let z=minZ; z<=maxZ; z++){
            const t = getEffectiveBlockType(x,y,z);
            if (isSolidBlock(t)){
              // AABB intersection quick check
              // block occupies [x,x+1] etc
              if (x+1 > x0 && x < x1 && y+1 > y0 && y < y1 && z+1 > z0 && z < z1){
                return true;
              }
            }
          }
        }
      }
      return false;
    }

    function movePlayer(dt){
      const p = gameState.local;
      if (!p) return;

      // mouse look is handled elsewhere in mousemove

      const forward = new THREE.Vector3(Math.sin(p.yaw), 0, Math.cos(p.yaw));
      const right = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));

      let moveX = 0, moveZ = 0, moveY = 0;
      const fast = keys.has('ShiftLeft') || keys.has('ShiftRight');

      const mode = p.gameMode;

      const sp = (mode === 'creative') ? PLAYER.speedCreative * (fast ? 1.6 : 1.0)
                                        : PLAYER.speedSurvival * (fast ? 1.6 : 1.0);

      if (keys.has('KeyW')) { moveX += forward.x; moveZ += forward.z; }
      if (keys.has('KeyS')) { moveX -= forward.x; moveZ -= forward.z; }
      if (keys.has('KeyD')) { moveX += right.x; moveZ += right.z; }
      if (keys.has('KeyA')) { moveX -= right.x; moveZ -= right.z; }

      if (mode === 'creative'){
        if (keys.has('Space')) moveY += 1;
        if (keys.has('ControlLeft') || keys.has('ControlRight')) moveY -= 1;
      } else {
        if ((keys.has('Space')) && p.onGround){
          p.vy = PLAYER.jumpVelocity;
          p.onGround = false;
        }
      }

      // normalize horizontal
      const len = Math.hypot(moveX, moveZ);
      if (len > 0){
        moveX /= len; moveZ /= len;
      }

      if (mode === 'creative'){
        // free-fly with collision optional (but keep simple collision)
        const dx = moveX * sp * dt;
        const dz = moveZ * sp * dt;
        const dy = moveY * sp * dt;

        // move with collision (optional but reduces clipping)
        const halfW = PLAYER.width/2;
        const y0 = p.y;
        const y1 = p.y + PLAYER.height;

        // X
        if (dx !== 0){
          const nx0 = (p.x + dx) - halfW;
          const nx1 = (p.x + dx) + halfW;
          if (!worldAABBIntersectsSolid(nx0, y0, p.z - halfW, nx1, y1, p.z + halfW)) p.x += dx;
        }
        // Z
        if (dz !== 0){
          const nz0 = (p.z + dz) - halfW;
          const nz1 = (p.z + dz) + halfW;
          if (!worldAABBIntersectsSolid(p.x - halfW, y0, nz0, p.x + halfW, y1, nz1)) p.z += dz;
        }
        // Y
        if (dy !== 0){
          const ny0 = p.y + dy;
          const ny1 = p.y + dy + PLAYER.height;
          // allow Y movement (but block if colliding)
          if (!worldAABBIntersectsSolid(p.x - halfW, ny0, p.z - halfW, p.x + halfW, ny1, p.z + halfW)) p.y += dy;
        }
        p.vy = 0;
        p.onGround = false; // not used in creative
      } else {
        // survival physics
        p.vx = moveX * sp;
        p.vz = moveZ * sp;

        p.vy -= PLAYER.gravity * dt;
        if (p.vy < -PLAYER.terminalVelocity) p.vy = -PLAYER.terminalVelocity;

        const dx = p.vx * dt;
        const dz = p.vz * dt;
        const dy = p.vy * dt;

        const halfW = PLAYER.width/2;
        const y0 = p.y;
        const y1 = p.y + PLAYER.height;

        // X collision
        if (dx !== 0){
          const nx0 = (p.x + dx) - halfW;
          const nx1 = (p.x + dx) + halfW;
          if (!worldAABBIntersectsSolid(nx0, y0, p.z - halfW, nx1, y1, p.z + halfW)) p.x += dx;
        }
        // Z collision
        if (dz !== 0){
          const nz0 = (p.z + dz) - halfW;
          const nz1 = (p.z + dz) + halfW;
          if (!worldAABBIntersectsSolid(p.x - halfW, y0, nz0, p.x + halfW, y1, nz1)) p.z += dz;
        }
        // Y collision
        if (dy !== 0){
          const ny0 = p.y + dy;
          const ny1 = p.y + dy + PLAYER.height;

          if (!worldAABBIntersectsSolid(p.x - halfW, ny0, p.z - halfW, p.x + halfW, ny1, p.z + halfW)) {
            p.y += dy;
          } else {
            // hit something vertically
            if (p.vy < 0){
              // falling => landed on ground
              p.y = Math.floor(p.y) + 1 - PLAYER.height; // snap-ish
              p.vy = 0;
              p.onGround = true;
            } else {
              // hitting ceiling
              p.vy = 0;
            }
          }
        }

        // ground check (simple)
        // if feet intersects solid -> onGround
        const feetY = p.y;
        const footBottom = feetY - 0.01;
        const footTop = feetY + 0.02;
        const solidBelow = worldAABBIntersectsSolid(p.x - halfW, footBottom, p.z - halfW, p.x + halfW, footTop, p.z + halfW);
        if (solidBelow && p.vy <= 0){
          p.onGround = true;
        }
      }
    }

    document.addEventListener('mousemove', (e) => {
      if (!pointerLocked) return;
      if (inventoryModal.style.display !== 'none') return;
      if (chatBox.style.display !== 'none') return;

      const sens = 0.0022; // mniejsza => mniej "ucieka"
      const mx = e.movementX || 0;

      if (gameState.local){
        gameState.local.yaw -= mx * sens;
        gameState.local.pitch -= my * sens;
        gameState.local.pitch = Math.max(-1.45, Math.min(1.45, gameState.local.pitch));
      }
    });

    // ===================== RAYCAST (VOXEL DDA) =====================
    function raycastBlock(maxDist){
      const p = gameState.local;
      if (!p) return null;

      const origin = new THREE.Vector3(p.x, p.y + PLAYER.eyeHeight, p.z);
      const dir = new THREE.Vector3(
        Math.sin(p.yaw) * Math.cos(p.pitch),
        Math.sin(p.pitch),
        Math.cos(p.yaw) * Math.cos(p.pitch)
      ).normalize();

      let x = Math.floor(origin.x);
      let y = Math.floor(origin.y);
      let z = Math.floor(origin.z);

      const dx = dir.x, dy = dir.y, dz = dir.z;

      const stepX = dx > 0 ? 1 : (dx < 0 ? -1 : 0);
      const stepY = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
      const stepZ = dz > 0 ? 1 : (dz < 0 ? -1 : 0);

      const tDeltaX = stepX !== 0 ? Math.abs(1 / dx) : Infinity;
      const tDeltaY = stepY !== 0 ? Math.abs(1 / dy) : Infinity;
      const tDeltaZ = stepZ !== 0 ? Math.abs(1 / dz) : Infinity;

      const fracX = origin.x - Math.floor(origin.x);
      const fracY = origin.y - Math.floor(origin.y);
      const fracZ = origin.z - Math.floor(origin.z);

      let tMaxX = Infinity, tMaxY = Infinity, tMaxZ = Infinity;

      if (stepX > 0) tMaxX = tDeltaX * (1 - fracX);
      else if (stepX < 0) tMaxX = tDeltaX * (fracX);

      if (stepY > 0) tMaxY = tDeltaY * (1 - fracY);
      else if (stepY < 0) tMaxY = tDeltaY * (fracY);

      if (stepZ > 0) tMaxZ = tDeltaZ * (1 - fracZ);
      else if (stepZ < 0) tMaxZ = tDeltaZ * (fracZ);

      let distTraveled = 0;

      // for face normal: remember which axis we stepped last to get current voxel
      let lastFaceNormal = {x:0,y:0,z:0};
      // check current voxel
      const t0 = getEffectiveBlockType(x,y,z);
      if (t0) {
        return { x,y,z,type:t0, face:{x:lastFaceNormal.x,y:lastFaceNormal.y,z:lastFaceNormal.z}, dist:0 };
      }

      while (distTraveled <= maxDist){
        if (tMaxX < tMaxY){
          if (tMaxX < tMaxZ){
            // step X
            x += stepX;
            distTraveled = tMaxX;
            tMaxX += tDeltaX;
            lastFaceNormal = { x:-stepX, y:0, z:0 };
          } else {
            // step Z
            z += stepZ;
            distTraveled = tMaxZ;
            tMaxZ += tDeltaZ;
            lastFaceNormal = { x:0, y:0, z:-stepZ };
          }
        } else {
          if (tMaxY < tMaxZ){
            // step Y
            y += stepY;
            distTraveled = tMaxY;
            tMaxY += tDeltaY;
            lastFaceNormal = { x:0, y:-stepY, z:0 };
          } else {
            // step Z
            z += stepZ;
            distTraveled = tMaxZ;
            tMaxZ += tDeltaZ;
            lastFaceNormal = { x:0, y:0, z:-stepZ };
          }
        }

        if (distTraveled > maxDist) break;

        // bounds
        if (x<0||x>=cfg.WORLD_SIZE||z<0||z>=cfg.WORLD_SIZE||y<0||y>=cfg.WORLD_HEIGHT) break;

        const type = getEffectiveBlockType(x,y,z);
        if (type){
          return { x,y,z,type, face:lastFaceNormal, dist:distTraveled };
        }
      }
      return null;
    }

    // ===================== MINING + BREAK / PLACE =====================
    function showMiningBar(p){

    function performBreak(hit){
      if (!hit) return;
      const {x,y,z,type} = hit;
      const targetKey = `${x},${y},${z}`;

      // prevent repeated breaks in creative when holding
      if (gameState.local.gameMode === 'creative'){
        if (gameState.miningLastBrokenKey === targetKey) return;
        gameState.miningLastBrokenKey = targetKey;
      }

      // Apply local edit immediately for responsiveness
      const changed = setEffectiveBlockTypeLocal(x,y,z,null);
      // Inform server
      if (changed){
        socket.emit('blockRemoved', { x,y,z });
      }

      // Drops + inventory (survival only)
      if (gameState.local.gameMode === 'survival'){
        const toolKey = selectedToolItemKey();
        const drops = getDropsForBlock(type, toolKey, x,y,z);
        addToInventoryOrHotbar(drops);
      }

      // reset mining
      gameState.miningActive = false;
      gameState.miningTarget = null;
      gameState.miningProgress = 0;
      hideMiningBar();
    }

    function performPlace(hitFace){
      const p = gameState.local;
      if (!p || !hitFace) return;

      if (!canPlaceBlock()) return;

      const placeKey = getSelectedItemKey();
      if (!placeKey || !PLACEABLE_BLOCKS.has(placeKey)) return;

      // face normal indicates adjacent voxel from hit block
      const nx = hitFace.x + hitFace.face.x;
      const ny = hitFace.y + hitFace.face.y;
      const nz = hitFace.z + hitFace.face.z;

      // bounds
      if (nx < 0 || nx >= cfg.WORLD_SIZE || nz < 0 || nz >= cfg.WORLD_SIZE || ny < 0 || ny >= cfg.WORLD_HEIGHT) return;

      // can't place inside another block
      const existing = getEffectiveBlockType(nx,ny,nz);
      if (existing) return;

      // survival: consume
      if (gameState.local.gameMode === 'survival'){
        if (!consumeSelectedBlock(1)) return;
      }

      const ok = setEffectiveBlockTypeLocal(nx,ny,nz, placeKey);
      if (ok){
        socket.emit('blockPlaced', { x:nx, y:ny, z:nz, type: placeKey });
      }
    }

    function updateMiningProgress(dt, nowMs){
      const p = gameState.local;
      if (!p) return;

      // RMB place (on cooldown)
      if (rightMouseDown && nowMs > gameState.placeCooldownUntil){
        const hit = raycastBlock(cfg.MAX_BUILD_DISTANCE);
        if (hit && hit.type){
          // only if selected item is block
          if (canPlaceBlock() && hit.face && (hit.face.x||hit.face.y||hit.face.z)){
            gameState.placeCooldownUntil = nowMs + 140; // throttle
            performPlace(hit);
          }
        }
      }

      // LMB mining
      if (!leftMouseDown){
        // stop mining if holding released
        if (gameState.miningActive){
          gameState.miningActive = false;
          gameState.miningTarget = null;
          gameState.miningProgress = 0;
          hideMiningBar();
        }
        return;
      }

      const hit = raycastBlock(cfg.MAX_BUILD_DISTANCE);
      if (!hit || !hit.type){
        if (gameState.miningActive){
          gameState.miningActive = false;
          gameState.miningTarget = null;
          gameState.miningProgress = 0;
          hideMiningBar();
        }
        return;
      }

      const targetKey = `${hit.x},${hit.y},${hit.z}`;
      const toolKey = selectedToolItemKey();

      // creative instant break on target change
      if (p.gameMode === 'creative'){
        if (gameState.miningLastBrokenKey !== targetKey){
          // instant
          performBreak(hit);
        }
        return;
      }

      // survival:
      if (!gameState.miningActive){
        // start only if we have real block
        gameState.miningActive = true;
        gameState.miningTarget = { x:hit.x, y:hit.y, z:hit.z, type:hit.type, key:targetKey };
        gameState.miningProgress = 0;
        showMiningBar(0);
      }

      // ensure target consistency: must match same block coordinates AND type
      const t = gameState.miningTarget;
      if (!t || t.key !== targetKey || t.type !== hit.type){
        gameState.miningActive = false;
        gameState.miningTarget = null;
        gameState.miningProgress = 0;
        hideMiningBar();
        return;
      }

      const duration = getBreakDurationSeconds(hit.type, toolKey);
      gameState.miningProgress += dt;

      const prog = duration > 0 ? (gameState.miningProgress / duration) : 1;
      showMiningBar(prog);

      if (gameState.miningProgress >= duration){
        performBreak(hit);
      }
    }

    // ===================== INVENTORY GRID =====================
    function renderInventoryGrid(){
  invGrid.innerHTML = '';

  if (!gameState.local) return;

  const mode = gameState.local.gameMode;

  // ==== CREATIVE: pokazuj listę creative itemów ====
  if (mode === 'creative') {
    const list = CREATIVE_ITEMS;

    for (const key of list){
      const div = document.createElement('div');
      div.className = 'invItem';

      const icon = document.createElement('div');
      icon.className = 'miniIcon';
      const col = itemIconColor(key);
      icon.style.background = `#${col.toString(16).padStart(6,'0')}`;
      icon.style.borderColor = '#2a3a4f';
      icon.textContent = itemName(key).length > 6 ? itemName(key).slice(0,6)+'…' : itemName(key).slice(0,6);

      const meta = document.createElement('div');
      meta.className = 'meta';

      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = itemName(key);

      const kindEl = document.createElement('div');
      kindEl.className = 'kind';
      kindEl.textContent = itemKind(key);

      meta.appendChild(nameEl);
      meta.appendChild(kindEl);

      div.appendChild(icon);
      div.appendChild(meta);

      div.addEventListener('click', () => {
        gameState.hotbar[gameState.selectedHotbar] = {
          key,
          count: PLACEABLE_BLOCKS.has(key) ? 64 : 1
        };
        updateHotbarUI();
        renderInventoryGrid();
      });

      invGrid.appendChild(div);
    }

    return;
  }

  // ==== SURVIVAL: pokazuj realne sloty hotbara + main inventory ====
  // Slot indeksy: 0..8 hotbar, 9..35 inv
  const total = HOTBAR_SIZE + INV_SIZE;

  for (let idx = 0; idx < total; idx++) {
    const isHotbar = idx < HOTBAR_SIZE;
    const st = isHotbar ? gameState.hotbar[idx] : gameState.inv[idx - HOTBAR_SIZE];

    const div = document.createElement('div');
    div.className = 'invItem';

    const icon = document.createElement('div');
    icon.className = 'miniIcon';

    if (!st || !st.key) {
      icon.style.background = '#0f1720';
      icon.style.borderColor = '#2a3a4f';
      icon.textContent = '—';
    } else {
      const key = st.key;
      const col = itemIconColor(key);
      icon.style.background = `#${col.toString(16).padStart(6,'0')}`;
      icon.style.borderColor = '#2a3a4f';
      icon.textContent = itemName(key).length > 6 ? itemName(key).slice(0,6)+'…' : itemName(key).slice(0,6);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = st && st.key ? itemName(st.key) : 'Pusto';

    const kindEl = document.createElement('div');
    kindEl.className = 'kind';
    kindEl.textContent = st && st.key ? itemKind(st.key) : '';

    meta.appendChild(nameEl);
    meta.appendChild(kindEl);

    // badge z ilością (dla nie-pustych)
    if (st && st.key && st.count > 1) {
      const countEl = document.createElement('div');
      countEl.style.marginLeft = 'auto';
      countEl.style.fontSize = '12px';
      countEl.style.color = 'rgba(230,237,243,.9)';
      countEl.textContent = `x${st.count}`;
      div.style.justifyContent = 'flex-start';
      div.style.alignItems = 'center';
      div.appendChild(icon);
      div.appendChild(meta);
      div.appendChild(countEl);
    } else {
      div.appendChild(icon);
      div.appendChild(meta);
    }

    // klik: hotbar = zmiana selektu, inv = swap z wybranym hotbar
    div.addEventListener('click', () => {
      if (!st || !st.key) {
        if (isHotbar) {
          gameState.selectedHotbar = idx;
          updateHotbarUI();
        }
        return;
      }

      if (isHotbar) {
        gameState.selectedHotbar = idx;
        updateHotbarUI();
        renderInventoryGrid();
      } else {
        const fromInvSlot = idx - HOTBAR_SIZE;
        const sel = gameState.selectedHotbar;

        // swap: hotbar[sel] <-> inv[fromInvSlot]
        const tmp = gameState.hotbar[sel];
        const from = gameState.inv[fromInvSlot];

        gameState.hotbar[sel] = { key: from.key, count: from.count };
        gameState.inv[fromInvSlot] = (!tmp || !tmp.key)
          ? makeEmptyStack()
          : { key: tmp.key, count: tmp.count };

        updateHotbarUI();
        renderInventoryGrid();
      }
    });

    invGrid.appendChild(div);
  }
}

    // ===================== WORLD + NETWORK HANDLERS =====================
    socket.on('connect', () => {
      overlayMsg.style.display = 'flex';
      overlayMsg.textContent = 'Ładowanie świata...';
    });

    socket.on('worldMeta', (meta) => {
      cfg.CHUNK_SIZE = meta.chunkSize;
      cfg.WORLD_SIZE = meta.worldSize;
      cfg.WORLD_HEIGHT = meta.worldHeight;
      cfg.WATER_LEVEL = meta.waterLevel;
      maxChunk = Math.floor(cfg.WORLD_SIZE / cfg.CHUNK_SIZE);
      worldSeed = meta.seed;
      TREE_PROB = Number(meta.treeProb) || 0.03;
    });

    socket.on('currentPlayers', (all) => {
      // set local
      const me = all[socket.id];
      if (me){
        gameState.local = {
          id: socket.id,
          x: me.x, y: me.y, z: me.z,
          yaw: me.yaw || 0,
          pitch: me.pitch || 0,
          name: me.name || 'Player',
          gameMode: me.gameMode || 'creative',
          vx:0,vz:0,vy:0,onGround:false
        };
        initInventoryForLocal(gameState.local.gameMode);
        updateHotbarUI();
      } else {
        // fallback
        gameState.local = {
          id: socket.id, x:Math.floor(cfg.WORLD_SIZE/2), y:10, z:Math.floor(cfg.WORLD_SIZE/2),
          yaw:0, pitch:0, name:'Player', gameMode:'creative', vx:0,vz:0,vy:0,onGround:false
        };
        initInventoryForLocal('creative');
        updateHotbarUI();
      }

      // remote players
      for (const pid in all){
        if (pid === socket.id) continue;
        const pl = all[pid];
        addOrUpdateRemotePlayer(pl);
      }

      worldReady = true;
      overlayMsg.style.display = 'none';

      // initial chunks
      updateChunksAroundPlayer(gameState.local.x, gameState.local.z);
      setPointerLock();
      updateRemotePlayerTransforms();
      requestInitialChunkBuilds();
    });

    socket.on('newPlayer', (pl) => {
      if (!pl || pl.id === socket.id) return;
      addOrUpdateRemotePlayer(pl);
    });

    socket.on('playerMoved', (pl) => {
      if (!pl || !pl.id || pl.id === socket.id) return;
      addOrUpdateRemotePlayer(pl);
    });

    socket.on('playerDisconnected', (id) => {
      const rec = gameState.remotePlayers.get(id);
      if (rec){
        worldGroup.remove(rec.group);
        gameState.remotePlayers.delete(id);
      }
    });

    socket.on('playerNameChanged', (d) => {
      // optional
    });

    function addOrUpdateRemotePlayer(pl){
      let rec = gameState.remotePlayers.get(pl.id);
      if (!rec){
        const group = createRemotePlayerMesh();
        worldGroup.add(group);
        rec = { group, player: {...pl} };
        gameState.remotePlayers.set(pl.id, rec);
      }
      rec.player = {
        ...rec.player,
        x: pl.x, y: pl.y, z: pl.z,
        yaw: pl.yaw || 0,
        pitch: pl.pitch || 0,
        name: pl.name || rec.player.name,
        gameMode: pl.gameMode || rec.player.gameMode
      };
      updateRemotePlayerTransformOne(rec);
    }

    function updateRemotePlayerTransforms(){
      for (const rec of gameState.remotePlayers.values()){
        updateRemotePlayerTransformOne(rec);
      }
    }

    function updateRemotePlayerTransformOne(rec){
      const p = rec.player;
      rec.group.position.set(p.x, p.y, p.z);
      // face direction
      rec.group.rotation.y = p.yaw || 0;
    }

    socket.on('blockUpdate', (u) => {
      if (!u) return;
      const {x,y,z,type} = u;

      // apply to local edits (even if chunk not loaded)
      setEffectiveBlockTypeLocal(x,y,z,type);
    });

    socket.on('chatMessage', (m) => {
      if (!m) return;
      const line = document.createElement('div');
      const name = m.name || 'Player';
      line.innerHTML = `<b>${escapeHtml(name)}:</b> ${escapeHtml(m.message||'')}`;
      chatLog.appendChild(line);
      chatLog.scrollTop = chatLog.scrollHeight;
    });

    function escapeHtml(s){
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
    }

    socket.on('chunkData', (d) => {
      if (!d) return;
      const cx = d.cx|0;
      const cz = d.cz|0;
      const cKey = chunkKey(cx,cz);

      // store edits
      if (d.edits && typeof d.edits === 'object'){
        gameState.editsByChunk[cKey] = d.edits;
      } else {
        gameState.editsByChunk[cKey] ||= {};
      }

      // build chunk if loaded/needed
      if (gameState.loadedChunkKeys.has(cKey)){
        updateChunkMesh(cx,cz);
      }
    });

    function requestInitialChunkBuilds(){
      // ensure current chunk region rebuild once to avoid initial pop
      updateChunksAroundPlayer(gameState.local.x, gameState.local.z);
      for (const k of gameState.loadedChunkKeys){
        const [scx, scz] = k.split(','); const cx=parseInt(scx,10), cz=parseInt(scz,10);
        updateChunkMesh(cx,cz);
      }
    }

    function setGameMode(mode){
      if (!gameState.local) return;
      gameState.local.gameMode = mode;
      socket.emit('setGameMode', mode);
      initInventoryForLocal(mode);
      updateHotbarUI();
      hideMiningBar();
      gameState.miningActive = false;
      gameState.miningTarget = null;
    }

    // ===================== CHUNK build on resize =====================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===================== MAIN LOOP =====================
    let lastT = performance.now();
    function animate(){
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;

      if (!worldReady) return;

      // movement
      if (gameState.local){
        movePlayer(dt);
        setCameraFromPlayer(gameState.local);

        // chunk updates
        updateChunksAroundPlayer(gameState.local.x, gameState.local.z);

        // send move to server
        sendPlayerMove(now);

        // remote players update
        updateRemotePlayerTransforms();

        // mining / place
        updateMiningProgress(dt, now);

        // if pointer locked, allow smooth camera update via yaw/pitch already handled
      }

      renderer.render(scene, camera);
    }

    // ===================== Start =====================
    // initial hotbar render
    updateHotbarUI();

    // click overlay to lock pointer
    canvas.addEventListener('mousedown', (e) => {
  if (!worldReady) return;
  if (e.button !== 0) return; // lewy przycisk tylko
  if (inventoryModal.style.display !== 'none') return;
  if (chatBox.style.display !== 'none') return;
  if (!pointerLocked) setPointerLock();
});

    // connect immediately
    requestAnimationFrame(animate);

  })();
  </script>
</body>
